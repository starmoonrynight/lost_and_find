<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>失物招领平台 · Lost &amp; Found</title>
<meta name="description" content="简洁的失物招领信息平台，支持发布寻物启事与失物招领、分类筛选、关键词搜索，数据保存在浏览器本地。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="./">
      <span class="brand-mark">🔍</span>
      <span class="brand-text">
        <strong>失物招领</strong>
        <small>Lost &amp; Found</small>
      </span>
    </a>
    <div class="header-actions">
      <button class="icon-btn" id="themeToggle" title="切换主题" aria-label="切换主题">🌙</button>
      <button class="btn btn-primary" id="btnPublish"><span aria-hidden="true">＋</span> 发布信息</button>
    </div>
  </div>
</header>

<main class="container">

  <section class="hero">
    <h1>让每一件<span class="gradient-text">失物</span>都能回家</h1>
    <p class="hero-sub">发布寻物启事 · 登记失物招领 · 数据仅保存在你的浏览器本地</p>
    <div class="search">
      <span class="search-icon" aria-hidden="true">🔎</span>
      <input type="search" id="searchInput" placeholder="搜索物品名称、地点或描述…" autocomplete="off" aria-label="搜索">
    </div>
    <div class="stats" id="stats"></div>
  </section>

  <section class="toolbar">
    <div class="tabs" id="typeTabs" role="tablist">
      <button class="active" data-type="all" role="tab">全部</button>
      <button data-type="lost" role="tab">寻物启事</button>
      <button data-type="found" role="tab">失物招领</button>
    </div>
    <div class="filters">
      <div class="select-wrap"><select id="categoryFilter" aria-label="按分类筛选"></select></div>
      <div class="select-wrap">
        <select id="statusFilter" aria-label="按状态筛选">
          <option value="all">全部状态</option>
          <option value="open" selected>进行中</option>
          <option value="closed">已解决</option>
        </select>
      </div>
      <div class="select-wrap">
        <select id="sortFilter" aria-label="排序方式">
          <option value="newest">最新发布</option>
          <option value="oldest">最早发布</option>
          <option value="dateDesc">发生时间↓</option>
        </select>
      </div>
    </div>
  </section>

  <section id="grid" class="grid" aria-live="polite"></section>

  <div class="empty" id="empty" hidden>
    <div class="empty-icon">🗂️</div>
    <h3>这里空空如也</h3>
    <p id="emptyText">还没有任何信息，快来发布第一条吧</p>
    <div class="empty-actions">
      <button class="btn btn-primary" id="btnPublishEmpty">发布第一条信息</button>
      <button class="btn btn-ghost" id="btnSeed">载入示例数据</button>
    </div>
  </div>

  <footer class="page-foot">
    <p>失物招领 · 纯前端演示项目 · 数据存储于浏览器 <code>localStorage</code></p>
    <p class="muted">请勿在公开页面填写身份证号、银行卡号等敏感信息</p>
  </footer>
</main>

<!-- ===== 发布信息弹窗 ===== -->
<div class="overlay" id="publishOverlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="publishTitle">
    <div class="modal-head">
      <h2 id="publishTitle">发布信息</h2>
      <button class="icon-btn" data-close aria-label="关闭">✕</button>
    </div>
    <form id="publishForm" class="modal-body" novalidate>
      <div class="field">
        <label>信息类型 <span class="req">*</span></label>
        <div class="segmented">
          <label><input type="radio" name="type" value="lost" checked><span>🔍 我丢了东西</span></label>
          <label><input type="radio" name="type" value="found"><span>📦 我捡到东西</span></label>
        </div>
      </div>

      <div class="field">
        <label for="fTitle">物品名称 <span class="req">*</span></label>
        <input id="fTitle" name="title" maxlength="40" placeholder="例如：黑色 iPhone 15 / 校园卡" required>
      </div>

      <div class="row">
        <div class="field">
          <label for="fCategory">物品分类 <span class="req">*</span></label>
          <div class="select-wrap"><select id="fCategory" name="category" required></select></div>
        </div>
        <div class="field">
          <label for="fDate">丢失 / 拾获时间 <span class="req">*</span></label>
          <input type="date" id="fDate" name="date" required>
        </div>
      </div>

      <div class="field">
        <label for="fLocation">地点 <span class="req">*</span></label>
        <input id="fLocation" name="location" maxlength="50" placeholder="例如：图书馆三楼自习区" required>
      </div>

      <div class="field">
        <label for="fDesc">详细描述</label>
        <textarea id="fDesc" name="description" rows="3" maxlength="300"
          placeholder="描述物品特征、颜色、品牌、内含物等，方便核对"></textarea>
      </div>

      <div class="field">
        <label for="fContact">联系方式 <span class="req">*</span></label>
        <input id="fContact" name="contact" maxlength="60" placeholder="微信 / 手机号 / 邮箱" required>
      </div>

      <div class="field">
        <label>物品图片（可选）</label>
        <div class="upload" id="uploadBox" role="button" tabindex="0">
          <input type="file" id="fImage" accept="image/*" hidden>
          <div class="upload-placeholder" id="uploadPlaceholder">
            <span class="upload-icon">🖼️</span>
            <p>点击上传图片，将自动压缩后保存在本地</p>
          </div>
          <img id="uploadPreview" alt="图片预览" hidden>
        </div>
        <button type="button" class="link-btn" id="removeImage" hidden>移除图片</button>
      </div>

      <p class="form-error" id="formError" hidden></p>

      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" data-close>取消</button>
        <button type="submit" class="btn btn-primary">确认发布</button>
      </div>
    </form>
  </div>
</div>

<!-- ===== 详情弹窗 ===== -->
<div class="overlay" id="detailOverlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-label="信息详情">
    <div class="modal-head">
      <h2>信息详情</h2>
      <button class="icon-btn" data-close aria-label="关闭">✕</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/app.js"></script>
</body>
</html>
